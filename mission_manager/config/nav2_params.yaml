# nav2_params.yaml — Nav2 configuration tuned for drone (not ground robot)
#
# Key differences from default Nav2 ground robot config:
#   - No AMCL (drone uses GPS + VIO, not lidar localization)
#   - 3D costmap projected to 2D for obstacle avoidance
#   - Larger tolerance values (drone GPS is ~1-2m accuracy)
#   - Higher max speed (drone can fly faster than ground robots)
#   - Rolling window local costmap (drone doesn't build a persistent map)

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.1
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.1
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0        # 2m tolerance (GPS accuracy)
      yaw_goal_tolerance: 6.28      # don't care about yaw (drone)
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 2.0               # max forward speed m/s
      max_vel_y: 1.0               # max lateral speed m/s
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 2.5
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 1.5
      decel_lim_x: -1.5
      decel_lim_y: -1.5
      decel_lim_theta: -1.5
      vx_samples: 15
      vy_samples: 5
      vtheta_samples: 15
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 2.0
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 2.0               # 2m planning tolerance
      use_astar: true
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 10                     # 10m × 10m local window
      height: 10
      resolution: 0.1               # 10cm resolution
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: oak_depth
        oak_depth:
          topic: /oak/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 3.0
          min_obstacle_height: 0.3
          obstacle_max_range: 5.0
          obstacle_min_range: 0.5
          raytrace_max_range: 6.0
          raytrace_min_range: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5       # 1.5m inflation (matches OAK-D warning distance)

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      width: 60                     # covers arena + corridors
      height: 50
      resolution: 0.2               # 20cm resolution
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: oak_depth
        oak_depth:
          topic: /oak/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 3.0
          min_obstacle_height: 0.3

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /mavros/local_position/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0    # don't pause at waypoints (continuous flight)

lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names:
      - "controller_server"
      - "planner_server"
      - "bt_navigator"
      - "waypoint_follower"
    bond_timeout: 10.0
    attempt_respawn_reconnection: true
